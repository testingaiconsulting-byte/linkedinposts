name: Publicar no LinkedIn

on:
  schedule:
    # De 15 em 15 minutos entre as 06:00 e as 20:59 UTC (07:00–21:59 em Lisboa no inverno)
    - cron: "*/15 6-20 * * *"
  workflow_dispatch:
    inputs:
      simulacao:
        description: "Só simular (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar posts devidos
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          DRY_RUN: ${{ inputs.simulacao && '1' || '' }}
        run: python publish.py
      - name: Registar o que foi publicado
        if: always()
        run: |
          if [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "linkedin-bot"
            git config user.email "linkedin-bot@users.noreply.github.com"
            git add published.json
            git commit -m "Regista posts publicados"
            git push
          fi
